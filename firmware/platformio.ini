; SolarInverterController v2 — ESP32 firmware
; Build:   pio run -e esp32
; Upload:  pio run -e esp32 -t upload          (USB)
;          pio run -e esp32 -t uploadfs        (LittleFS web assets)
; Tests:   pio test -e native                  (host-side protocol/parser tests)

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
extra_scripts = pre:gzip_fs.py
; setup.html is also baked into the firmware so the AP captive portal works
; even when the LittleFS image hasn't been flashed (plain ./flash.sh).
board_build.embed_txtfiles = data/setup.html
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=\"2.2.0\"
    -std=gnu++17
    ; Brownout detector disabled: this board's regulator dips at WiFi start.
    ; Trades brownout protection for the ability to run — see README. Prefer
    ; fixing the power path (bigger caps / better board) for the real install.
    -DDISABLE_BROWNOUT
build_unflags = -std=gnu++11
lib_deps =
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.7.4
    bertmelis/espMqttClient@^1.7.0
    bblanchon/ArduinoJson@^7.4.1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -DNATIVE_TEST
    -DFW_VERSION=\"2.2.0\"
    -Isrc
build_src_filter =
    -<*>
    +<drivers/>
