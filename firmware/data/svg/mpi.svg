<svg viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- reusable solar-panel icon -->
    <g id="ico-panel">
      <rect x="-16" y="-11" width="32" height="22" rx="2" fill="#12507a" stroke="#7fc0ea" stroke-width="1.3"/>
      <line x1="-5.3" y1="-11" x2="-5.3" y2="11" stroke="#7fc0ea" stroke-width="0.8"/>
      <line x1="5.3"  y1="-11" x2="5.3"  y2="11" stroke="#7fc0ea" stroke-width="0.8"/>
      <line x1="-16"  y1="0"   x2="16"   y2="0"  stroke="#7fc0ea" stroke-width="0.8"/>
      <line x1="0" y1="11" x2="0" y2="16" stroke="#9aa7b4" stroke-width="1.6"/>
      <line x1="-7" y1="16" x2="7" y2="16" stroke="#9aa7b4" stroke-width="1.6"/>
    </g>
  </defs>

  <!-- flows -->
  <path id="flow-pv1"  class="flow c-pv"   d="M245,95  C310,95 310,180 375,195"/>
  <path id="flow-pv2"  class="flow c-pv"   d="M245,225 C305,225 315,225 375,220"/>
  <path id="flow-grid" class="flow c-grid" d="M675,120 C600,120 600,190 545,200"/>
  <path id="flow-load" class="flow c-load" d="M545,255 C605,265 600,350 675,360"/>
  <path id="flow-batt" class="flow c-batt" d="M460,395 L460,305"/>

  <!-- PV1 -->
  <g>
    <rect class="node" x="35" y="45" width="210" height="100" rx="10"/>
    <use href="#ico-panel" transform="translate(70,95)"/>
    <text class="node-label" x="150" y="70" text-anchor="middle">SOLAR 1</text>
    <text class="node-value" x="150" y="98" text-anchor="middle" id="v-pv1w">—</text>
    <text class="node-sub"   x="150" y="120" text-anchor="middle" id="v-pv1v">—</text>
    <text class="node-sub"   x="150" y="137" text-anchor="middle" id="v-pv1a">—</text>
  </g>

  <!-- PV2 -->
  <g>
    <rect class="node" x="35" y="175" width="210" height="100" rx="10"/>
    <use href="#ico-panel" transform="translate(70,225)"/>
    <text class="node-label" x="150" y="200" text-anchor="middle">SOLAR 2</text>
    <text class="node-value" x="150" y="228" text-anchor="middle" id="v-pv2w">—</text>
    <text class="node-sub"   x="150" y="250" text-anchor="middle" id="v-pv2v">—</text>
    <text class="node-sub"   x="150" y="267" text-anchor="middle" id="v-pv2a">—</text>
  </g>

  <!-- inverter (center) -->
  <g>
    <rect class="node" x="375" y="150" width="170" height="205" rx="10"/>
    <text class="node-label" x="460" y="176" text-anchor="middle">MPI 10KW</text>
    <text class="node-sub"   x="460" y="198" text-anchor="middle" id="v-mode">—</text>
    <text x="460" y="248" text-anchor="middle" id="v-util" fill="#38b6ff" font-size="40" font-weight="800">—</text>
    <text class="node-sub"   x="460" y="270" text-anchor="middle">utilization</text>
    <text class="node-sub"   x="460" y="308" text-anchor="middle" id="v-temp">—</text>
    <text class="node-sub"   x="460" y="328" text-anchor="middle" id="v-feedmax">—</text>
    <text class="node-sub"   x="460" y="346" text-anchor="middle" id="v-outfreq">—</text>
  </g>

  <!-- grid (3-phase): watt · volt · (current) per phase -->
  <g>
    <rect class="node" x="675" y="25" width="215" height="205" rx="10"/>
    <text class="node-label" x="782" y="48" text-anchor="middle">⚡ GRID  3~</text>
    <text class="node-sub" x="684" y="74" font-weight="700">R</text>
    <text class="node-value" x="698" y="74" font-size="10.5" id="v-gridr-w">—</text>
    <text class="node-sub"   x="758" y="74" font-size="10.5" id="v-gridr-v">—</text>
    <text class="node-sub"   x="812" y="74" font-size="10.5" id="v-gridr-a">—</text>
    <text class="node-sub" x="684" y="96" font-weight="700">S</text>
    <text class="node-value" x="698" y="96" font-size="10.5" id="v-grids-w">—</text>
    <text class="node-sub"   x="758" y="96" font-size="10.5" id="v-grids-v">—</text>
    <text class="node-sub"   x="812" y="96" font-size="10.5" id="v-grids-a">—</text>
    <text class="node-sub" x="684" y="118" font-weight="700">T</text>
    <text class="node-value" x="698" y="118" font-size="10.5" id="v-gridt-w">—</text>
    <text class="node-sub"   x="758" y="118" font-size="10.5" id="v-gridt-v">—</text>
    <text class="node-sub"   x="812" y="118" font-size="10.5" id="v-gridt-a">—</text>
    <line x1="686" y1="134" x2="878" y2="134" stroke="#2d3945" stroke-width="1"/>
    <text class="node-value" x="782" y="162" text-anchor="middle" id="v-gridw">—</text>
    <text x="782" y="182" text-anchor="middle" id="v-gridstate" font-size="12" font-weight="700" fill="#8494a5">—</text>
    <text class="node-sub"   x="782" y="202" text-anchor="middle" id="v-gridf">—</text>
  </g>

  <!-- load (3-phase): watt · volt · (current) per phase -->
  <g>
    <rect class="node" x="675" y="290" width="215" height="205" rx="10"/>
    <text class="node-label" x="782" y="313" text-anchor="middle">🏠 LOAD  3~</text>
    <text class="node-sub" x="684" y="339" font-weight="700">R</text>
    <text class="node-value" x="698" y="339" font-size="10.5" id="v-loadr-w">—</text>
    <text class="node-sub"   x="758" y="339" font-size="10.5" id="v-loadr-v">—</text>
    <text class="node-sub"   x="812" y="339" font-size="10.5" id="v-loadr-a">—</text>
    <text class="node-sub" x="684" y="361" font-weight="700">S</text>
    <text class="node-value" x="698" y="361" font-size="10.5" id="v-loads-w">—</text>
    <text class="node-sub"   x="758" y="361" font-size="10.5" id="v-loads-v">—</text>
    <text class="node-sub"   x="812" y="361" font-size="10.5" id="v-loads-a">—</text>
    <text class="node-sub" x="684" y="383" font-weight="700">T</text>
    <text class="node-value" x="698" y="383" font-size="10.5" id="v-loadt-w">—</text>
    <text class="node-sub"   x="758" y="383" font-size="10.5" id="v-loadt-v">—</text>
    <text class="node-sub"   x="812" y="383" font-size="10.5" id="v-loadt-a">—</text>
    <line x1="686" y1="399" x2="878" y2="399" stroke="#2d3945" stroke-width="1"/>
    <text class="node-value" x="782" y="429" text-anchor="middle" id="v-loadw">—</text>
    <text class="node-sub"   x="782" y="453" text-anchor="middle" id="v-loadpct">—</text>
  </g>

  <!-- battery -->
  <g>
    <rect class="node" x="375" y="388" width="170" height="124" rx="10"/>
    <text class="node-label" x="460" y="410" text-anchor="middle">🔋 BATTERY</text>
    <text class="node-value" x="460" y="435" text-anchor="middle" id="v-battw">—</text>
    <text x="460" y="454" text-anchor="middle" id="v-battstate" font-size="12" font-weight="700" fill="#8494a5">—</text>
    <text class="node-sub"   x="452" y="475" text-anchor="end"    id="v-battv">—</text>
    <text class="node-sub"   x="468" y="475" text-anchor="start"  id="v-batta">—</text>
    <text class="node-sub"   x="460" y="494" text-anchor="middle" id="v-battc">—</text>
  </g>
</svg>
