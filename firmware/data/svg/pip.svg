<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg">
  <!-- flows (under nodes) -->
  <path id="flow-grid" class="flow c-grid" d="M450,115 L450,175"/>
  <path id="flow-pv"   class="flow c-pv"   d="M265,235 L365,235"/>
  <path id="flow-load" class="flow c-load" d="M535,235 L635,235"/>
  <path id="flow-batt" class="flow c-batt" d="M450,355 L450,295"/>

  <!-- grid -->
  <g>
    <rect class="node" x="360" y="20" width="180" height="95" rx="10"/>
    <text class="node-label" x="450" y="42" text-anchor="middle">⚡ GRID</text>
    <text class="node-value" x="450" y="68" text-anchor="middle" id="v-gridv">—</text>
    <text class="node-sub"   x="450" y="90" text-anchor="middle" id="v-gridf">—</text>
  </g>

  <!-- pv -->
  <g>
    <rect class="node" x="60" y="180" width="205" height="110" rx="10"/>
    <text class="node-label" x="162" y="205" text-anchor="middle">☀ SOLAR</text>
    <text class="node-value" x="162" y="235" text-anchor="middle" id="v-pvw">—</text>
    <text class="node-sub"   x="162" y="258" text-anchor="middle" id="v-pvv">—</text>
    <text class="node-sub"   x="162" y="276" text-anchor="middle" id="v-pva">—</text>
  </g>

  <!-- inverter -->
  <g>
    <rect class="node" x="365" y="175" width="170" height="120" rx="10"/>
    <text class="node-label" x="450" y="200" text-anchor="middle">INVERTER</text>
    <text class="node-value" x="450" y="230" text-anchor="middle" id="v-mode">—</text>
    <text class="node-sub"   x="450" y="255" text-anchor="middle" id="v-temp">—</text>
    <text class="node-sub"   x="450" y="275" text-anchor="middle" id="v-busv">—</text>
  </g>

  <!-- load -->
  <g>
    <rect class="node" x="635" y="180" width="205" height="110" rx="10"/>
    <text class="node-label" x="737" y="205" text-anchor="middle">🏠 LOAD</text>
    <text class="node-value" x="737" y="235" text-anchor="middle" id="v-loadw">—</text>
    <text class="node-sub"   x="737" y="258" text-anchor="middle" id="v-loadva">—</text>
    <text class="node-sub"   x="737" y="276" text-anchor="middle" id="v-loadpct">—</text>
  </g>

  <!-- battery -->
  <g>
    <rect class="node" x="360" y="355" width="180" height="100" rx="10"/>
    <text class="node-label" x="450" y="380" text-anchor="middle">🔋 BATTERY</text>
    <text class="node-value" x="450" y="408" text-anchor="middle" id="v-battv">—</text>
    <text class="node-sub"   x="450" y="430" text-anchor="middle" id="v-batta">—</text>
    <text class="node-sub"   x="450" y="447" text-anchor="middle" id="v-battc">—</text>
  </g>
</svg>
